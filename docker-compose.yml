services:
  php-app:
    build: .
    container_name: doki-main-app
    # Note: Running as root to allow Docker socket access
    # For production, configure proper group permissions
    environment:
      # Host path mapping for Docker-in-Docker volume mounts
      - HOST_APP_PATH=${PWD}/app
      - HOST_DOCKER_PATH=${PWD}/docker
      - DOKI_GO_ORCH_ENABLED=${DOKI_GO_ORCH_ENABLED:-1}
      - DOKI_ORCH_URL=${DOKI_ORCH_URL:-http://go-orchestrator:8098}
      - DOKI_ORCH_TOKEN=${DOKI_ORCH_TOKEN:-dev-insecure}
      - DOKI_UPDATE_HELPER_URL=${DOKI_UPDATE_HELPER_URL:-http://localhost:8100}
    volumes:
      - ./app:/var/www/html:rw,z
      - doki-sessions:/var/www/sessions
      - ./templates:/var/www/templates:ro  # Templates are read-only
      - ./infrastructure:/var/www/infrastructure:ro  # Infrastructure examples
      - ./docker:/var/www/docker:ro  # Docker build files for runner images
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/apache2:/var/serverlogs:ro
      - /:/host_root:ro  # Gives read-only access to the entire host filesystem
    ports:
      - "8099:80"
    restart: unless-stopped
    privileged: true

  update-helper:
    build:
      context: .
      dockerfile: docker/update-helper/Dockerfile
    container_name: doki-update-helper
    environment:
      - DOKI_REPO_ROOT=/workspace
      - DOKI_UPDATE_PORT=8100
      - DOKI_UPDATE_REMOTE=origin
      - DOKI_UPDATE_CORE_SERVICES=php-app,go-orchestrator
      - DOKI_UPDATE_TOKEN_FILE=/workspace/app/data/update-helper/tokens.json
      - DOKI_UPDATE_STATE_FILE=/workspace/app/data/update-helper/state.json
      - DOKI_DB_PATH=/workspace/app/data/doki.db
      - DOKI_APP_HEALTH_URL=http://php-app/
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new
    volumes:
      - ./:/workspace:rw,z
      - ${HOME}/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${DOKI_UPDATE_HELPER_PORT:-8100}:8100"
    restart: unless-stopped
    privileged: true

  go-orchestrator:
    build: ./orchestrator-go
    container_name: doki-go-orchestrator
    environment:
      - ORCH_LISTEN_ADDR=:8098
      - ORCH_CONTROL_PLANE_URL=http://php-app
      - DOKI_ORCH_TOKEN=${DOKI_ORCH_TOKEN:-dev-insecure}
      - ORCH_APP_DIR=/var/www/html
      - HOST_APP_PATH=${PWD}/app
    volumes:
      - ./app:/var/www/html:rw,z
      - doki-sessions:/var/www/sessions
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DOKI_ORCH_HOST_PORT:-8098}:8098"
    depends_on:
      - php-app
    restart: unless-stopped
    privileged: true

volumes:
  doki-sessions:
